<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Lịch Khám Bệnh - Bệnh viện Đa khoa Tâm Anh</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }
        .header-bg {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            color: white;
            padding: 40px 0;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .card-custom {
            border: none;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            background: white;
        }
        .form-label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 8px;
        }
        .form-control, .form-select {
            border-radius: 8px;
            padding: 10px 15px;
            border: 1px solid #ced4da;
        }
        .form-control:focus, .form-select:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }
        .section-title {
            color: #0d6efd;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-weight: 700;
        }
        .btn-submit {
            background-color: #0d6efd;
            border: none;
            border-radius: 8px;
            padding: 12px 30px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        .btn-submit:hover {
            background-color: #0b5ed7;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(13, 110, 253, 0.3);
        }
        .btn-back {
            border-radius: 8px;
            padding: 12px 25px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header-bg text-center">
        <div class="container">
            <h1 class="fw-bold"><i class="fa-solid fa-hospital-user me-2"></i>ĐẶT LỊCH KHÁM BỆNH</h1>
            <p class="lead mb-0">Chăm sóc sức khỏe toàn diện - Nhanh chóng & Tiện lợi</p>
        </div>
    </div>

    <!-- Main Content Form -->
    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card card-custom p-4 p-md-5">
                    
                    <!-- Hiển thị thông báo thành công / lỗi nếu có (Flash attributes) -->
                    <div th:if="${thongBaoThanhCong != null}" class="alert alert-success" th:text="${thongBaoThanhCong}"></div>
                    <div th:if="${errorText != null}" class="alert alert-danger" th:text="${errorText}"></div>

                    <form th:action="@{/dat-lich-kham}" method="POST" id="appointmentForm">
                        
                        <!-- SECTION 1: THÔNG TIN BỆNH NHÂN -->
                        <h4 class="section-title"><i class="fa-solid fa-user me-2"></i>1. Thông Tin Bệnh Nhân</h4>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="fullName" class="form-label">Họ và tên <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="fullName" name="fullName" placeholder="Nguyễn Văn A" required>
                            </div>
                            <div class="col-md-6">
                                <label for="phone" class="form-label">Số điện thoại <span class="text-danger">*</span></label>
                                <input type="tel" class="form-control" id="phone" name="phone" placeholder="0901234567" pattern="[0-9]{10}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="dob" class="form-label">Ngày sinh <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" id="dob" name="dob" required>
                            </div>
                            <div class="col-md-6">
                                <label for="gender" class="form-label">Giới tính <span class="text-danger">*</span></label>
                                <select class="form-select" id="gender" name="gender" required>
                                    <option value="" selected disabled>-- Chọn giới tính --</option>
                                    <option value="Nam">Nam</option>
                                    <option value="Nữ">Nữ</option>
                                    <option value="Khác">Khác</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label">Email (Nhận xác nhận)</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="example@gmail.com">
                            </div>
                            <div class="col-md-6">
                                <label for="address" class="form-label">Địa chỉ hiện tại</label>
                                <input type="text" class="form-control" id="address" name="address" placeholder="Số nhà, đường, phường/xã, quận/huyện...">
                            </div>
                        </div>

                        <!-- SECTION 2: THÔNG TIN ĐẶT KHÁM -->
                        <h4 class="section-title mt-4"><i class="fa-solid fa-calendar-check me-2"></i>2. Thông Tin Khám Bệnh</h4>
                        <div class="row g-3 mb-4">
                            
                            <!-- ĐÃ SỬA: Đổ Chuyên khoa từ DB bằng Thymeleaf -->
                            <div class="col-md-6">
                                <label for="departmentSelect" class="form-label">Chuyên khoa <span class="text-danger">*</span></label>
                                <select class="form-select" id="departmentSelect" name="departmentId" required>
                                    <option value="" selected disabled>-- Chọn chuyên khoa --</option>
                                    <th:block th:each="khoa : ${dsChuyenKhoa}">
                                        <option th:value="${khoa.id}" th:text="${khoa.tenChuyenKhoa}"></option>
                                    </th:block>
                                </select>
                            </div>

                            <!-- ĐÃ SỬA: Bác sĩ được đổ tự động qua AJAX dựa trên Chuyên khoa -->
                            <div class="col-md-6">
                                <label for="doctorSelect" class="form-label">Bác sĩ mong muốn (Không bắt buộc)</label>
                                <select class="form-select" id="doctorSelect" name="doctorId">
                                    <option value="" selected>-- Chọn bác sĩ --</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="appointmentDate" class="form-label">Ngày khám dự kiến <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" id="appointmentDate" name="appointmentDate" required>
                            </div>
                            <div class="col-md-6">
                                <label for="appointmentTime" class="form-label">Khung giờ khám <span class="text-danger">*</span></label>
                                <select class="form-select" id="appointmentTime" name="appointmentTime" required>
                                    <option value="" selected disabled>-- Chọn buổi khám --</option>
                                    <option value="Sang">Buổi Sáng (07:30 - 11:30)</option>
                                    <option value="Chieu">Buổi Chiều (13:30 - 16:30)</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label for="symptoms" class="form-label">Mô tả triệu chứng / Lý do khám</label>
                                <textarea class="form-control" id="symptoms" name="symptoms" rows="3" placeholder="Mô tả chi tiết các triệu chứng bạn đang gặp phải hoặc nhu cầu khám..."></textarea>
                            </div>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex justify-content-between align-items-center mt-4">
                            <a href="/" class="btn btn-outline-secondary btn-back">
                                <i class="fa-solid fa-arrow-left me-1"></i> Quay lại
                            </a>
                            <button type="submit" class="btn btn-primary btn-submit">
                                <i class="fa-solid fa-paper-plane me-1"></i> Xác Nhận Đặt Lịch
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ĐÃ SỬA: SCRIPT XỬ LÝ LẤY DỮ LIỆU BÁC SĨ ĐỘNG TỪ DB -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Giới hạn ngày đặt lịch (không chọn ngày quá khứ)
            const dateInput = document.getElementById('appointmentDate');
            if (dateInput) {
                const today = new Date().toISOString().split('T')[0];
                dateInput.setAttribute('min', today);
            }

            const departmentSelect = document.getElementById('departmentSelect');
            const doctorSelect = document.getElementById('doctorSelect');

            // Lắng nghe sự kiện đổi Chuyên khoa
            departmentSelect.addEventListener('change', function () {
                const selectedKhoaId = this.value;

                // Reset danh sách bác sĩ
                doctorSelect.innerHTML = '<option value="" selected>-- Chọn bác sĩ (Không bắt buộc) --</option>';

                if (!selectedKhoaId) return;

                // Gọi API backend lấy danh sách Bác sĩ thuộc Chuyên khoa vừa chọn
                fetch(`/api/bac-si/by-khoa?khoaId=${selectedKhoaId}`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Lỗi truy xuất dữ liệu!');
                        }
                        return response.json();
                    })
                    .then(data => {
                        data.forEach(bs => {
                            const option = document.createElement('option');
                            option.value = bs.id; // Giá trị gửi về backend khi submit form
                            option.textContent = (bs.hocVi ? bs.hocVi + ' ' : '') + bs.hoTen;
                            doctorSelect.appendChild(option);
                        });
                    })
                    .catch(error => {
                        console.error('Lỗi khi tải danh sách bác sĩ:', error);
                    });
            });
        });
    </script>
    <!-- Modal thông báo đặt lịch thành công -->
    <div class="modal fade" id="bookingSuccessModal" tabindex="-1" aria-labelledby="bookingSuccessModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title text-success" id="bookingSuccessModalLabel"><i class="fa-solid fa-circle-check me-2"></i>Chúc mừng!</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body py-4 text-center">
                    <p class="mb-3 fw-semibold" id="bookingSuccessMessage">Bạn đã đặt lịch thành công.</p>
                    <p class="text-muted">Thông tin lịch khám sẽ được lưu trong Hệ thống.</p>
                    <button type="button" class="btn btn-success rounded-pill px-4" data-bs-dismiss="modal">Đóng</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('appointmentForm');
            const submitBtn = form.querySelector('button[type="submit"]');
            const successModalEl = document.getElementById('bookingSuccessModal');
            const successMessageEl = document.getElementById('bookingSuccessMessage');
            const successModal = new bootstrap.Modal(successModalEl);

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>Đang gửi...';

                const data = new URLSearchParams(new FormData(form));

                fetch('/api/dat-lich', {
                    method: 'POST',
                    headers: { 'Accept': 'application/json' },
                    body: data
                })
                .then(async res => {
                    const json = await res.json().catch(() => ({ success: false, message: 'Lỗi phản hồi từ server' }));
                    if (res.ok && json.success) {
                        successMessageEl.textContent = json.message || 'Chúc mừng bạn đã đặt lịch thành công!';
                        successModal.show();
                        form.reset();
                    } else {
                        successMessageEl.textContent = json.message || 'Không thể đặt lịch, vui lòng thử lại.';
                        successModal.show();
                    }
                })
                .catch(err => {
                    console.error(err);
                    successMessageEl.textContent = 'Lỗi kết nối tới server. Vui lòng thử lại.';
                    successModal.show();
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane me-1"></i> Xác Nhận Đặt Lịch';
                });
            });
        });
    </script>

</body>
</html>
