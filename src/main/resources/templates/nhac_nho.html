<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhắc Nhở Lịch Tái Khám</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .custom-card { background: #fff; border-radius: 16px; border: 1px solid #e3e6f0; }
        .fs-7 { font-size: 0.875rem; }
    </style>
</head>
<body class="p-4">

    <div class="container-fluid">
        <!-- HEADER -->
        <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded-3 shadow-sm">
            <div class="d-flex align-items-center gap-3">
                <a th:href="@{/bac_si}" class="btn btn-outline-secondary btn-sm rounded-2">
                    <i class="fa-solid fa-arrow-left me-1"></i> Quay lại
                </a>
                <h5 class="fw-bold text-dark mb-0">Quản Lý Nhắc Nhở Tái Khám 🔔</h5>
            </div>
        </div>

        <!-- BẢNG DANH SÁCH TÁI KHÁM -->
        <div class="custom-card p-4 shadow-sm">
            <h6 class="fw-bold text-uppercase text-secondary mb-3 fs-7">Danh sách bệnh nhân cần tái khám</h6>
            
<div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Bệnh nhân</th>
                            <th>Số điện thoại</th>
                            <th>Ngày tái khám</th>
                            <th>Còn lại</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Nếu không có dữ liệu -->
                        <tr th:if="${reminders == null || #lists.isEmpty(reminders)}">
                            <td colspan="5" class="text-center text-muted py-4">Hiện tại chưa có lịch tái khám nào.</td>
                        </tr>

                        <!-- Vòng lặp hiển thị danh sách tái khám -->
                        <tr th:each="item, stat : ${reminders}">
                            <td th:text="${stat.count}">1</td>
                            <td><span class="fw-bold" th:text="${item.hoTenBenhNhan}">Nguyễn Văn A</span></td>
                            <td th:text="${item.soDienThoai}">0901234567</td>
<td>
                                <span class="badge bg-warning text-dark fs-7"
                                      th:text="${item.ngayTaiKham != null ? item.ngayTaiKham : '-'}">
                                    2026-08-19
                                </span>
                            </td>
                            <td>
                                <span class="badge"
                                      th:classappend="${item.soNgayConLai > 3 ? ' bg-info text-dark' :
                                       item.soNgayConLai > 0 ? ' bg-warning text-dark' :
                                       item.soNgayConLai == 0 ? ' bg-danger text-white' :
                                       ' bg-secondary text-white'}"
                                      th:text="${item.soNgayConLai > 0 ?
                                       'Còn ' + item.soNgayConLai + ' ngày' :
                                       item.soNgayConLai == 0 ?
                                       'Hôm nay' :
                                       'Đã quá lịch'}">
                                    Còn 10 ngày
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
