<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đội Ngũ Bác Sĩ Chuyên Khoa</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .navbar-custom {
            background-color: #0077c2;
        }
        .header-section {
            background: linear-gradient(rgba(0, 119, 194, 0.9), rgba(0, 119, 194, 0.8));
            color: white;
            padding: 40px 0;
            text-align: center;
        }
        .doctor-card {
            border: none;
            border-radius: 12px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 3px 10px rgba(0,0,0,0.04);
            background: #ffffff;
            overflow: hidden;
        }
        .doctor-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,119,194,0.12);
        }
        .doctor-img-container {
            height: 100%;
            min-height: 200px;
        }
        .doctor-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .department-title {
            color: #0077c2;
            border-bottom: 3px solid #0077c2;
            padding-bottom: 8px;
            margin-top: 40px;
            margin-bottom: 25px;
            font-weight: 700;
        }
        .btn-booking {
            background-color: #0077c2;
            color: white;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
        }
        .btn-booking:hover {
            background-color: #0284c7;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Thanh điều hướng -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm">
        <div class="container d-flex align-items-center">
            <a class="navbar-brand fw-bold text-white text-decoration-none" href="/">
                <i class="fa-solid fa-house me-2"></i>Trang Chủ
            </a>
        </div>
    </nav>

    <!-- Tiêu đề đầu trang -->
    <div class="header-section mb-4">
        <div class="container">
            <h1 class="fw-bold mb-2">Đội Ngũ Bác Sĩ Chuyên Khoa</h1>
            <p class="lead text-white-50 mb-0">Hệ thống y tế chất lượng cao với các chuyên gia đầu ngành</p>
        </div>
    </div>

    <div class="container mb-5">

        <!-- VÒNG LẶP OUTSIDE: Lặp qua từng Chuyên Khoa trong Database -->
        <div th:each="khoa : ${danhSachChuyenKhoa}" class="mb-5">
            
            <!-- Tiêu Đề Của Từng Chuyên Khoa -->
            <h3 class="department-title">
                <i class="fa-solid fa-stethoscope me-2"></i>
                <span th:text="${khoa.tenChuyenKhoa}">Khoa Nội</span>
            </h3>
            
            <div class="row g-4">
                <!-- VÒNG LẶP INSIDE: Lặp qua danh sách Bác Sĩ của Chuyên Khoa này -->
                <div class="col-lg-6" th:each="bs : ${khoa.danhSachBacSi}">
                    <div class="card doctor-card h-100">
                        <div class="row g-0 h-100">
                            
                            <!-- ẢNH BÁC SĨ (Lấy động từ cột 'anh' trong Database) -->
                            <div class="col-4 doctor-img-container">
                                <img th:src="@{${bs.anh}}" 
                                     onerror="this.src='https://images.unsplash.com/photo-1537368910025-700350fe46c7?auto=format&fit=crop&q=80&w=400'" 
                                     class="doctor-img" 
                                     th:alt="${bs.hoTen}">
                            </div>
                            
                            <!-- THÔNG TIN BÁC SĨ -->
                            <div class="col-8">
                                <div class="card-body d-flex flex-column h-100 p-3">
                                    
                                    <!-- Badge Chuyên Khoa -->
                                    <span class="badge bg-primary bg-opacity-10 text-primary align-self-start mb-1"
                                          th:text="${khoa.tenChuyenKhoa}">
                                        Khoa Nội
                                    </span>

                                    <!-- Tên & Học vị Bác Sĩ -->
                                    <h5 class="card-title fw-bold text-dark mb-1" 
                                        th:text="${(bs.hocVi != null ? bs.hocVi + ' ' : '') + bs.hoTen}">
                                        TS.BS. Nguyễn Văn Minh
                                    </h5>

                                    <!-- Số năm kinh nghiệm / Học vị bổ sung (nếu có) -->
                                    <p class="text-muted small mb-2" th:if="${bs.soNamKinhNghiem != null}">
                                        Kinh nghiệm: <span th:text="${bs.soNamKinhNghiem}">5</span> năm
                                    </p>

                                    <!-- Nút Đặt Lịch Khám -->
                                    <div class="mt-auto">
                                        <a th:href="@{/dat_lich_kham_benh(doctor=${bs.hoTen})}" 
                                           class="btn btn-booking btn-sm w-100">
                                            <i class="fa-solid fa-calendar-check me-1"></i>Đặt Lịch Khám
                                        </a>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- KẾT THÚC LẶP BÁC SĨ -->
            </div>

        </div>
        <!-- KẾT THÚC LẶP CHUYÊN KHOA -->

    </div>

</body>
</html>
